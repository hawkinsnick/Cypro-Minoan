name: Validate EpiDoc pilot

on:
  pull_request:
    paths:
      - 'interchange/epidoc/**'
      - 'scripts/export_epidoc_occurrences.py'
      - 'tests/test_epidoc_occurrences.py'
      - 'tests/test_epidoc_reference_integrity.py'
      - 'tests/test_epidoc_schematron.py'
      - 'tests/test_upstream_epidoc.py'
      - 'scripts/validate_upstream_epidoc.py'
      - 'analysis/upstream-epidoc-validation.json'
      - '.github/workflows/validate-epidoc.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  epidoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate occurrence pilot and run loss-prevention invariants
        run: |
          python scripts/export_epidoc_occurrences.py
          python tests/test_epidoc_occurrences.py
          python tests/test_epidoc_reference_integrity.py
      - name: Validate project-specific ISO Schematron
        run: |
          python -m pip install 'lxml>=5,<7'
          python tests/test_epidoc_schematron.py
      - name: Install Jing
        run: sudo apt-get update && sudo apt-get install -y jing
      - name: Fetch EpiDoc 9.8 Relax NG from immutable upstream commit
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/EpiDoc/Source/2368ee115d8008b32c37446301874945bcbe6c18/schema/9.8/tei-epidoc.rng \
            --output /tmp/tei-epidoc-9.8.rng
      - name: Record upstream schema digest and reject empty schema
        run: |
          test -s /tmp/tei-epidoc-9.8.rng
          sha256sum /tmp/tei-epidoc-9.8.rng | tee /tmp/tei-epidoc-9.8.sha256
          grep -q 'http://relaxng.org/ns/structure/1.0' /tmp/tei-epidoc-9.8.rng
      - name: Validate generated XML against EpiDoc 9.8
        run: jing /tmp/tei-epidoc-9.8.rng interchange/epidoc/occurrences-pilot.xml
      - name: Verify committed artifact is exporter-canonical
        run: git diff --exit-code -- interchange/epidoc/occurrences-pilot.xml
      - name: Validate pinned upstream embedded Schematron and expected schema digest
        env:
          EPIDOC_SCHEMA: /tmp/epidoc-source/schema/9.8/tei-epidoc.rng
          SCHEMATRON_COMPILER: /tmp/iso-schematron/trunk/schematron/code
        run: |
          python -m pip install 'saxonche==12.9.0'
          git init /tmp/epidoc-source
          git -C /tmp/epidoc-source remote add origin https://github.com/EpiDoc/Source.git
          git -C /tmp/epidoc-source fetch --depth 1 origin 2368ee115d8008b32c37446301874945bcbe6c18
          git -C /tmp/epidoc-source checkout --detach FETCH_HEAD
          git init /tmp/iso-schematron
          git -C /tmp/iso-schematron remote add origin https://github.com/Schematron/schematron.git
          git -C /tmp/iso-schematron fetch --depth 1 origin 77dcd36c53d12ed786c144ece3b2af7694abdc56
          git -C /tmp/iso-schematron checkout --detach FETCH_HEAD
          python scripts/validate_upstream_epidoc.py --schema "$EPIDOC_SCHEMA" --compiler "$SCHEMATRON_COMPILER"
          python -m unittest discover -s tests -p test_upstream_epidoc.py
