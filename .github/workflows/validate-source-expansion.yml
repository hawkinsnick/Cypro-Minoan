name: Validate bounded source expansion
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_source_expansion.py
      - run: python -m unittest discover -s scripts -p test_source_expansion.py
      - run: python scripts/validate_reconciliation.py
      - run: python -m unittest discover -s scripts -p test_reconciliation.py
      - run: python -m unittest discover -s scripts -p test_assertion_views.py
      - run: python scripts/assertion_views.py --write && git diff --exit-code -- research/qualified-assertion-views.json exports/qualified-assertions.csv
