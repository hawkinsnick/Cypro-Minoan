name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_current_state.py
      - run: python scripts/test_current_state.py
      - run: python scripts/validate.py
      - run: python scripts/validate_current.py
      - run: python scripts/test_release_integrity.py
      - run: python scripts/test_5_0_conformance.py

