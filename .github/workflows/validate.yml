name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_current_state.py
      - run: python scripts/test_current_state.py
      - run: python scripts/research_dossiers.py
      - run: python scripts/test_research_dossiers.py
      - run: python scripts/validate.py
      - run: python scripts/validate_current.py
      - run: python scripts/test_release_integrity.py
      - run: python scripts/test_5_0_conformance.py

      - run: python scripts/test_occurrence_coverage.py
      - run: python scripts/test_scholarly_boundary.py
      - run: python scripts/test_pre_expert_maximum.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked native milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          test -f "releases/$version.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing immutable release $tag retained."
          else
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if test -n "$existing"; then
              test "$existing" = "$GITHUB_SHA"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag --latest=true --title "Cypro-Minoan $version" --notes-file "releases/$version.md"
          fi
